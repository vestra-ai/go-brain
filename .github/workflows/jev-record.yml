# Records Jev's real answers for the reflex test set (apps/brain/src/reflex/testsets/chat.jsonl) and keeps them in the
# job's artifact, with the scores and the bar sweep the script prints. It runs only when a pull request gets the label
# jev-record, never on a push: each run is one Jev call per row on the repo's TYPESAFE_API_KEY. A pull request run
# reads its own copy of this file, so it needs nothing on main. Jev's address and model are the script's defaults,
# the same as brain-rehearsal's (it sets neither TYPESAFE_BASE_URL nor JEV_MODEL).
name: jev-record
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: jev-record
  cancel-in-progress: false
jobs:
  record:
    # Never for a fork's pull request: the job holds the repo's Jev key.
    if: github.event.label.name == 'jev-record' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # GitHub masks secrets already; this masks the key in every later step's output as well, whatever prints it.
      - name: Mask the key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: echo "::add-mask::$TYPESAFE_API_KEY"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The key lives in this step and the mask step only: install, build and the upload never see it, and the script never prints it.
      - name: Record Jev's answers
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm --filter @go/brain jev:record | tee jev-record.txt
      - name: Keep the answers and the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-record
          path: |
            apps/brain/src/reflex/testsets/recorded/jev-1.13.0.json
            jev-record.txt
          if-no-files-found: ignore
