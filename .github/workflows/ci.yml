name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # The OpenAPI files are generated from the zod schemas; fail if someone edited the schemas
      # without regenerating them (the Go team builds from those files).
      - run: pnpm --filter @go/contract emit-openapi && git diff --exit-code packages/contract/openapi

  contract-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -e 'packages/contract-py[dev]'
      - run: pytest -q packages/contract-py/tests
      # models.py is generated from the OpenAPI file; fail if it is stale.
      - run: cd packages/contract-py && python scripts/gen_models.py && git diff --exit-code go_contract/models.py
