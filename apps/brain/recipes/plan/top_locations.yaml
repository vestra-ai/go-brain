id: plan.top_locations
title: The destinations ixigo's trip planner lists as popular in India
asks:
  - popular places to visit in india
  - where is everyone travelling these days
auth: none
changes_state: false
# /plan asks for its popular places as it opens.
page: /plan
fast: { url: /itinerary-planner/api/itinerary/getTopLocations?country=IN }
capture:
  - /itinerary-planner/api/itinerary/getTopLocations?country=IN
read:
  rows: { from: /itinerary-planner/api/itinerary/getTopLocations?country=IN, list: '($type($) = "array" ? $[0] : $).data' }
answer:
  as: facts
  title: Popular destinations on ixigo
  max: 20
  each: '$type(displayname) = "string" ? { "place": displayname }'
ttl_minutes: 60
samples: { page: plan.top_locations.json }
measured: { fast_ms: 58, page_ms: 2980, flow_ms: null }
notes: For one of them, plan.destination takes its name; plan.explore lists places by month from a city.
