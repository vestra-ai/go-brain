id: trip.flights_each
title: Each person's flights to the trip from their own home city
asks:
  - find flights for everyone from their own cities
  - sabke liye unke sheher se flights dhundo
  - each of us needs a flight to goa from where we live
inputs:
  to: { kind: text, value: $trip.destination, about: where the trip goes }
  date: { kind: date, value: $trip.start, about: the day everyone flies }
  cabin: { kind: choice, optional: true, about: "economy, premium_economy or business" }
steps:
  # Each member's home city, the cities most people come from first; a home in the trip's own place flies nowhere.
  each: $trip.homes[$lowercase($) != $lowercase($$.to)]
  as: home
  run:
    # The city's flights page (paced: one flights page across every trip in 20 s), read once for everyone there: each
    # person's leaving time narrows it in Go (travel/flights-each.ts). And always the link to ixigo's own page, for a city
    # whose page doesn't come.
    - { recipe: flights.results, given: { from: $home, to: to, date: date, cabin: cabin } }
    - { recipe: flights.search, given: { from: $home, to: to, date: date, cabin: cabin } }
answer: { as: compare }
notes: >-
  Each person's own flights (the Server's B7): one flights page per home city, read side by side on the trip's
  computer, and a card per city and leaving time for those people alone (travel/flights-each.ts). A ticket is each
  traveller's own pick, never a group vote.
