id: buses.city_lookup
title: A city or boarding point for a bus search, as ixigo's bus box knows it
asks:
  - mumbai
  - bangalore, all boarding points
inputs:
  words: { kind: text, about: the place as the person said it }
keeps: buses
box:
  # The suggestion call itself, opened as the page: no box to find, type into or wait on (the 8 Oct drill: typing
  # into the box timed out on the box's browser). The box below is how a person does it, for the flow speed.
  open: "/wap/abus-autocompleter/api/v1/results?s={words}"
  page: /buses
  type:
    from:
      - { op: type, role: textbox, name: Leaving From, text: "{words}" }
      - { op: wait_for, match: /wap/abus-autocompleter/api/v1/results }
    to:
      - { op: type, role: textbox, name: Going To, text: "{words}" }
      - { op: wait_for, match: /wap/abus-autocompleter/api/v1/results }
capture:
  - { match: /wap/abus-autocompleter/api/v1/results, min_count: 1, max_count: 6, max_bytes: 200000 }
answer:
  as: places
  suggestions:
    words_param: s
    list: $
    name: display_text
    line: "display_subtext ? display_subtext : state_name"
    # The entry with the city's boarding points is the one the box shows as "(All boarding points)".
    all: "$count(boarding_points) > 0"
    country: "'India'"
    place: "{ 'name': $trim(city) ? $trim(city) : display_text, 'id': $number(id) }"
    place_name: name
samples: { bangalore: buses.city_lookup.bangalore.json, hampi: buses.city_lookup.hampi.json }
notes: AbhiBus's city ids go in the results address, /buses/bus_search/{name}/{id}/….
