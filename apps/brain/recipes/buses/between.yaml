id: buses.between
title: Buses between two cities on a date
asks:
  - buses from mumbai to goa on friday
  - mumbai se goa bus kal raat
  - any sleeper bus bangalore to hampi on the 20th
inputs:
  from: { kind: place, lookup: buses.city_lookup, about: the city or boarding point people leave from }
  to: { kind: place, lookup: buses.city_lookup, about: the city or boarding point people go to }
  date: { kind: date, about: the day the bus leaves }
auth: none
changes_state: false
page: /buses/bus_search/{from.name}/{from.id}/{to.name}/{to.id}/{date|DD-MM-YYYY}/O
# The page first loads /buslist/v3/services/meta/{n}: the "$" keeps the list itself. The list loads only in a drawn tab,
# which Bash's browser fetch gives each fetch.
capture:
  - /buslist/v3/services$
# What the group watches on the stage: the buses come in, a scroll brings their cards (operator, bus type, times, fare,
# seats left) on screen, and the last picture waits for them to be drawn.
fetch:
  - when: "true"
    steps:
      - { op: wait_for, match: /buslist/v3/services$ }
      - { op: scroll, times: 1 }
    settle_ms: 550
read:
  rows: { from: /buslist/v3/services$, list: services }
  also:
    # Each operator by its id: whether it is a state transport's (RTC).
    operators: { from: /buslist/v3/services$, value: operators }
answer:
  as: options
  kind: bus
  # A price is the lowest seat fare after the offer ixigo applies on its own ("₹3000, From ₹2700" is 2,700).
  # Every detail but the operator, the fare and the start may be missing or null. arriveTimestamp is India's clock written
  # as if it were UTC, so the arrival is the departure plus the journey time,
  # and that clock only when the journey time is missing. ixigo has no page per bus: "Select Seats" opens on the results.
  each: |
    (
      $mins := $minutes(timings.travelTime);
      $arrive := $exists($mins) ? $istPlus(timings.startTimeDateFormat, $mins) : (timings.arriveTimestamp ? $istFromWallSeconds(timings.arriveTimestamp));
      $operator := $trim(travelerAgentName);
      $seats := $num(seatStats.availableSeats);
      $kind := $lowercase(($type(busTypeName) = "string" ? busTypeName : "") & " " & ($type(busType) = "string" ? busType : ""));
      $ac := $contains($kind, /non[\s-]?a\.?\/?c/) ? false : ($contains($kind, /\ba\.?\/?c\b/) ? true);
      $flags := flags;
      $flag := function($f) { $num($lookup($flags, $f)) = 1 ? true };
      $op := $operators ? $lookup($operators, $string(operatorId));
      $fc := $flag("isFcOperator");
      $offer := $num(fares.offerPrice);
      $rating := $num(rating);
      $ratings := $num(noOfRatings);
      $exists($arrive) ? {
        "title": $operator,
        "priceMinor": $paise($offer ? $offer : $num(fares.fare)),
        "currency": "INR",
        "priceNote": "per seat, from",
        "journey": {
          "mode": "bus",
          "origin": { "name": $inputs.from.name },
          "destination": { "name": $inputs.to.name },
          "depart_at": timings.startTimeDateFormat,
          "arrive_at": $arrive,
          "carrier_name": $substring($operator, 0, 60)
        },
        "rating": ($exists($rating) and ($exists($ratings) ? $ratings : 1) > 0) ? $rating,
        "highlights": $highlights(busTypeName, $exists($mins) ? $hoursMinutes($mins), ($exists($seats) and $seats <= 5) ? $string($seats) & " seat" & ($seats = 1 ? "" : "s") & " left", $fc ? "Free cancellation"),
        "facts": {
          "bus_type": busTypeName, "seats_left": $seats, "duration_min": $mins, "reviews": $ratings,
          "ac": $ac,
          "sleeper": $contains($kind, /sleeper/) ? true,
          "seater": $contains($kind, /seater/) ? true,
          "volvo": ($flag("isVolvo") or $flag("isVolvo9600")) ? true,
          "electric": $flag("isElectric"),
          "luxury": $flag("isLuxury"),
          "women_safe_boarding": $flag("isWomenSafeBoarding"),
          "female_seats_left": $num(seatStats.femaleAvailableCount),
          "single_berths": $num(seatStats.singleBerthsCount),
          "window_seats": $num(seatStats.windowSeatCount),
          "free_cancellation": $fc,
          "assured": $flag("isAssuredOperator"),
          "live_tracking": $flag("isTrackAvail"),
          "state_transport": ($op.isGovtOperator = "1" or $num($op.isRTC) = 1) ? true,
          "via": ($type(viaPlaces) = "string" and $trim(viaPlaces) != "") ? $substring($trim(viaPlaces), 0, 80),
          "tags": $join($texts(3, tags.title), ", ") ? $substring($join($texts(3, tags.title), ", "), 0, 80)
        },
        "sourceUrl": $page
      }
    )
measured: { fast_ms: null, page_ms: 2600, flow_ms: null }
notes: The results list is AbhiBus's; one bus card holds its operator, type, times, lowest fare and seats left.
