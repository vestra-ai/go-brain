id: trains.by_name
title: A train found by its name or number in ixigo's train box, with its route and classes
asks:
  - mandovi express number
  - which train is 12780
  - goa express kaha se kaha jaati hai
inputs:
  train: { kind: text, about: "the train's name or number as people said it, such as Mandovi Express or 10103" }
auth: none
changes_state: false
# ixigo's "Train Name / Number" page asks its box's call as the words are typed. A name can answer both directions
# (10103 to Madgaon, 10104 back) and near names: each is a row, and the model asks which one when it isn't clear.
page: /trains/name-number
fetch:
  - when: "true"
    steps:
      - { op: type, role: searchbox, name: Search trains by name or number, text: "{train}" }
      - { op: wait_for, match: searchFor=getTrainByNameOrCode }
fast:
  url: /action/content/trainstation?searchFor=getTrainByNameOrCode&nameOrCode={train}
# The box asks again as the words grow, so a fetch may keep a few answers: the rows are every answer's trains that the
# words name, each train once.
capture:
  - { match: searchFor=getTrainByNameOrCode, min_count: 1, max_count: 6, max_bytes: 200000 }
read:
  rows:
    from: searchFor=getTrainByNameOrCode
    list: |
      (
        $all := $type($[0]) = "array" ? $reduce($, function($a, $b) { $append($a, $b) }) : $;
        $w := $lowercase($trim($inputs.train));
        $all[$type($) = "object" and (c = $w or $contains($lowercase(n), $w))]
      )
    unique: c
answer:
  as: facts
  title: "{train}"
  max: 8
  each: |
    $type(c) = "string" ? {
      "number": c,
      "name": $titleWords(n),
      "from": originName & " (" & origin & ")",
      "to": destinationName & " (" & destination & ")",
      "classes": [$split(ct, ":")[$ != ""]],
      "runs_daily": d = "127"
    }
samples: { page: trains.by_name.json }
measured: { fast_ms: 120, page_ms: null, flow_ms: 2200 }
notes: The row's d is the days it runs as seven bits; 127 is every day.
