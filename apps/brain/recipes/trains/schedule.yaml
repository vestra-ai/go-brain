id: trains.schedule
title: A train's route and timetable, stop by stop, with its days, classes, platforms and usual delay
asks:
  - 10103 ka route
  - mandovi express stops
  - what time does 10103 reach madgaon
inputs:
  train: { kind: text, about: "the train's 5-digit number (trains.by_name finds it from a name)" }
auth: none
changes_state: false
# ixigo's train page is plain server-rendered HTML (no data call): a table of the train's facts (classes, days, stops,
# duration, type, pantry) and a table of its stops, one row each: code, name, arrives, departs, stop time, distance,
# platform, route, day and its average delay. The page also shows the coach order, which is not a table (not read here).
page: /trains/{train}
capture:
  - { match: "/trains/{train}$", max_bytes: 1000000 }
read:
  rows: { from: "/trains/{train}$", format: html_tables, list: "[ $ ]" }
answer:
  as: facts
  title: "Train {train}"
  max: 1
  each: |
    (
      $table := function($first) { $reduce(tables, function($found, $t) { $t[0][0] = $first ? $t : $found }, []) };
      $info := $table("Classes");
      $stops := $table("Stn Code");
      $facts := $count($info) > 0 ? $merge($map($info, function($r) { { $r[0]: $r[1] } }));
      {
        "train": $substringBefore(title, " Train Route"),
        "route": $substringAfter(title, " | "),
        "runs_on": $lookup($facts, "Service Days"),
        "classes": $lookup($facts, "Classes"),
        "takes": $lookup($facts, "Duration"),
        "type": $lookup($facts, "Type"),
        "pantry": $lookup($facts, "Pantry"),
        "stops": $map($stops, function($r, $i) { $i > 0 ? (
          $r[1] & " (" & $r[0] & "): " & ($r[2] = "starts" ? "starts" : "arrives " & $r[2]) & ", " & ($r[3] = "ends" ? "ends" : "departs " & $r[3])
            & ", day " & $r[8] & ($r[6] != "-" ? ", platform " & $r[6] : "") & ($r[5] != "0" ? ", " & $r[5] : "")
            & ($r[9] ? ", usual delay " & $r[9] : "")
        ) })
      }
    )
ttl_minutes: 60
samples: { page: trains.schedule.html }
measured: { fast_ms: null, page_ms: 9570, flow_ms: null }
notes: The platforms and delays are ixigo's usual ones, not today's (trains.running_status). Day 2 is the next day.
