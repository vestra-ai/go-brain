id: help.downtime
title: Whether anything on ixigo is down right now, from ixigo's own notice
asks:
  - is ixigo down
  - why can't we book on ixigo right now
auth: none
changes_state: false
# /support asks for ongoing outages as it opens: an empty list when nothing is down.
page: /support
fast: { url: /support/helpcenter/api/v1/downtime?ongoing=true, headers: { ixisrc: ixiweb, clientid: ixiweb } }
capture:
  - /support/helpcenter/api/v1/downtime?ongoing=true
read:
  rows: { from: /support/helpcenter/api/v1/downtime?ongoing=true, list: '[{ "ongoing": ($type($) = "array" ? $[0] : $).data }]' }
answer:
  as: facts
  title: ixigo right now
  max: 1
  each: |
    {
      "anything_down": $count(ongoing) > 0,
      "notices": [ongoing.($type($) = "string" ? $ : ($type(title) = "string" ? title : $string($)))]
    }
ttl_minutes: 5
samples: { page: help.downtime.json }
measured: { fast_ms: 155, page_ms: 2130, flow_ms: null }
notes: Nothing was down on 7 Oct 2026, so the shape of a notice is not seen yet; one is passed on as ixigo gives it.
