id: help.faq
title: ixigo's own answers on one help topic, such as ixigo money, ixigo assured, the ixigo AU credit card or booking problems
asks:
  - how does ixigo money work
  - what is ixigo assured
  - what does the ixigo credit card give
  - not able to book on ixigo, what do we do
  - ixigo money kaise use karte hain
inputs:
  # The topics as help.services lists them.
  topic:
    kind: choice
    optional: true
    about: >-
      the help topic: about-ixigo (the default), account-faq, money-faq (ixigo money), pre-booking (booking problems),
      money-max-faq (instant refunds), ixigo-assured (free cancellation), au-credit-card (the ixigo AU credit card),
      payment-faq (saved cards and wallets), metro or tourpackages (holiday packages)
auth: none
changes_state: false
# /support answers its About ixigo questions as it opens; a topic's own questions come when its card is clicked. Each
# topic is its own fetch, clicked by the card's second line, until a step can take its words from an input. Only the
# topic's own call is kept.
let:
  # A topic ixigo doesn't list reads as About ixigo, which the title then says.
  tag: >-
    ($t := $lowercase($trim(topic)); $t in ['account-faq', 'money-faq', 'pre-booking', 'money-max-faq', 'ixigo-assured',
    'au-credit-card', 'payment-faq', 'metro', 'tourpackages'] ? $t : 'about-ixigo')
page: /support
# The fast speed asks for the topic's answers straight away: no card to click.
fast: { url: "/support/helpcenter/api/v1/questions/general?tags={$tag}", headers: { ixisrc: ixiweb, clientid: ixiweb } }
capture:
  - "/support/helpcenter/api/v1/questions/general?tags={$tag}"
fetch:
  - when: "$tag = 'account-faq'"
    steps: [{ op: click, text: "Update email, phone no. or password" }]
  - when: "$tag = 'money-faq'"
    steps: [{ op: click, text: "View ixigo money transaction details and rules" }]
  - when: "$tag = 'pre-booking'"
    steps: [{ op: click, text: "Facing issue while booking? Not able to book?" }]
  - when: "$tag = 'money-max-faq'"
    steps: [{ op: click, text: "Seamless instant refunds" }]
  - when: "$tag = 'ixigo-assured'"
    steps: [{ op: click, text: "Get free cancellation benefits" }]
  - when: "$tag = 'au-credit-card'"
    steps: [{ op: click, text: "Your Gateway To Exclusive Perks" }]
  - when: "$tag = 'payment-faq'"
    steps: [{ op: click, text: "Delete saved cards or link/delink wallets" }]
  - when: "$tag = 'metro'"
    steps: [{ op: click, text: "Metro Tickets Made Simple" }]
  - when: "$tag = 'tourpackages'"
    steps: [{ op: click, text: "Unforgettable Tours Made Simple" }]
read:
  rows: { from: "/support/helpcenter/api/v1/questions/general?tags={$tag}", list: '($type($) = "array" ? $[0] : $).data[$not(isActive = false)]' }
answer:
  as: facts
  title: "ixigo's answers on {$tag}"
  max: 20
  # Answers are HTML: read as text.
  each: |
    (
      $html := $join(contents.text.en, " ");
      $text := $replace($replace($replace($html, /<br\s*\/?>|<\/p>|<\/li>/, " "), /<[^>]+>/, ""), /&nbsp;/, " ");
      $type(header.en) = "string" ? {
        "question": $trim(header.en),
        "answer": $trim($replace($replace($text, /&amp;/, "&"), /\s+/, " "))
      }
    )
ttl_minutes: 60
samples: { money: help.faq.money.json }
measured: { fast_ms: 123, page_ms: 2130, flow_ms: null }
notes: >-
  Counts on 7 Oct 2026: pre-booking 73, au-credit-card 19, metro 18, ixigo-assured 13, money-max-faq 8, tourpackages 8,
  about-ixigo 8, money-faq 6, account-faq 4, payment-faq 3. The calls need the page's own headers, so only the page makes them.
