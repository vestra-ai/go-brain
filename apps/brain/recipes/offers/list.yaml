id: offers.list
title: The offers at the top of ixigo's offers page, and the banks and cards that have offers now
asks:
  - any offers on ixigo right now
  - which bank cards have offers on ixigo
  - koi offer chal raha hai kya
auth: none
changes_state: false
# /offers is an older Next.js page: its first nine offers (sales and single offers, flights, hotels and trains together),
# the counts and the banks sit in its __NEXT_DATA__ script. The rest load as the person scrolls, so a product's own
# offers are better read where it is searched (hotels.offers over a place's stays).
page: /offers
capture:
  - { match: /offers$, max_bytes: 1000000 }
read:
  rows:
    from: /offers$
    format: next_data
    list: |
      (
        $d := ($type($) = "array" ? $[0] : $).props.pageProps.data;
        $until := function($t) { $t ? $fromMillis($toMillis($t), '[D] [MNn,*-3] [Y]', '+0530') };
        [
          { "offers_on_ixigo": $d.count, "by_journey": [$d.journeyGroups.($lowercase(journeyType) & ": " & $string(count))] },
          { "banks_with_offers": [$d.paymentTypesOfferGroup.(paymentType & ": " & $string(associatedOffers))] },
          $d.offers.(
            offerType = "CAMPAIGN" ? {
              "sale": campaignName,
              "for": [groupedProducts.$lowercase($)],
              "banks": [paymentTypeGroups.paymentType],
              "until": $until(endDate),
              "campaign": campaignSlug
            } : {
              "offer": offerTitle,
              "code": offerCode,
              "for": product ? $lowercase(product),
              "bank": paymentType,
              "until": $until(endDate),
              "details": slug
            }
          )
        ]
      )
answer:
  as: facts
  title: Offers on ixigo now
  max: 12
  each: $
ttl_minutes: 60
samples: { page: offers.list.html }
measured: { fast_ms: 63, page_ms: 2630, flow_ms: null }
notes: >-
  "details" is an offer's name for offers.details, "campaign" a sale's for offers.campaign. Every offer needs the
  person's ixigo login and the named card at payment: Go only says which code fits.
