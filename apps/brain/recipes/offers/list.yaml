id: offers.list
title: The offers on ixigo now, for a product, a journey and a bank when asked, and the banks and cards that have offers
asks:
  - any offers on ixigo right now
  - which bank cards have offers on ixigo
  - best offers on HDFC for our Goa flights
  - any hotel offers for an international trip
  - koi offer chal raha hai kya
  - HDFC card pe flight ka koi offer hai kya
# Each one filters the same list on the page (narrows): a read without them holds the answer, and the ixigo tool takes
# an early read of the same message instead of a new run (p5's #407).
inputs:
  product: { kind: choice, optional: true, narrows: true, about: "flights, hotels or trains: the offers page's own tabs (bus offers are buses.offers)" }
  journey: { kind: choice, optional: true, narrows: true, about: "domestic or international: the page's own Journey Type buttons" }
  bank: { kind: text, optional: true, narrows: true, about: "a bank, card or way to pay someone has, as the page's bank list names it, such as HDFC Bank, AU Bank, ICICI Bank, UPI or CRED" }
auth: none
changes_state: false
# The offers page has a tab a product (Flights, Trains, Hotels), Journey Type buttons ("Domestic 50 Offers",
# "International 49 Offers") and a checkbox a bank ("HDFC Bank HDFC Bank 3 Offers"), 10 Oct 2026. Asked for one, Go opens
# that tab and presses the same buttons the person would, then keeps only the offers that fit: a single offer's product,
# a sale's products, the journey (an offer for both journeys fits either), and the bank of the offer or of any bank in
# the sale. The page's first offers, the counts and the banks sit in its __NEXT_DATA__ script; the rest load as the person
# scrolls. The fast speed asks for them all at once (49 domestic on 8 Oct), as the page itself asks: with no journey
# when none is given.
let:
  product_code: >-
    ($p := $lowercase($trim(product)); $p in ['flights', 'flight'] ? 'FLIGHTS' : $p in ['hotels', 'hotel', 'stays', 'stay'] ? 'HOTELS' : $p in ['trains', 'train'] ? 'TRAINS')
  # The product's tab under /offers: "/tag/hotels", or none for all of them.
  tab: >-
    $product_code = 'FLIGHTS' ? '/tag/flight-offers' : $product_code = 'HOTELS' ? '/tag/hotels' : $product_code = 'TRAINS' ? '/tag/trains' : ''
  journey_type: "($j := $lowercase($trim(journey)); $j = 'international' ? 'INTERNATIONAL' : $j = 'domestic' ? 'DOMESTIC')"
  journey_param: "$journey_type ? 'journeyType=' & $journey_type & '&'"
  journey_button: "$journey_type = 'INTERNATIONAL' ? 'International' : $journey_type = 'DOMESTIC' ? 'Domestic'"
  bank_words: "$type(bank) = 'string' and $trim(bank) != '' ? $trim(bank)"
page: "/offers{$tab|raw}"
# The page's document, and the offers' own calls: the next pages as the list scrolls, and a pressed filter's.
capture:
  - { match: "/offers{$tab}$", max_bytes: 1000000 }
  - { match: /upahaar-inventory/api/offers/v2/list, required: false, max_count: 6, max_bytes: 1000000 }
# The buttons the person would press, so the group sees the same list: the journey, then the bank's checkbox. Either may
# be missing on a tab (no international offers there); the offers that fit are kept below all the same.
fetch:
  - when: "$exists($journey_button) and $exists($bank_words)"
    steps:
      - { op: click, role: button, text: "{$journey_button}", optional: true }
      - { op: click, role: checkbox, text: "{$bank_words}", optional: true }
      - { op: scroll, times: 2 }
  - when: "$exists($journey_button)"
    steps: [{ op: click, role: button, text: "{$journey_button}", optional: true }, { op: scroll, times: 2 }]
  - when: "$exists($bank_words)"
    steps: [{ op: click, role: checkbox, text: "{$bank_words}", optional: true }, { op: scroll, times: 2 }]
  - when: "$exists($product_code)"
    steps: [{ op: scroll, times: 2 }]
read:
  rows:
    # The page's document on any tab (its address has "ixigo.com/offers"; the offers' calls do not), or the fast call.
    from: ixigo.com/offers
    format: next_data
    list: &offers |
      (
        $body := $type($) = "array" ? $[0] : $;
        $d := $body.props ? $body.props.pageProps.data : $body.data;
        $all := [$d.offers, $more.data.offers];
        $until := function($t) { $t ? $fromMillis($toMillis($t), '[D] [MNn,*-3] [Y]', '+0530') };
        /* The days an offer works on, as seven 0s and 1s from Sunday ("1000111": Sunday, Thursday, Friday, Saturday). */
        $validOn := function($r) {
          $type($r) = "string" and $contains($r, /^[01]{7}$/)
            ? ($on := [$filter([0..6], function($i) { $substring($r, $i, 1) = "1" })]; $count($on) < 7 and $count($on) > 0 ? $join($map($on, function($i) { ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][$i] }), ", "))
            : ($type($r) = "array" ? $join($r.$string($), ", ") : $r)
        };
        /* A bank as both sides write it, "HDFC" or "HDFC Bank", "IDFC FIRST Bank " or "idfc": its own words only. */
        $norm := function($s) { $trim($replace($replace($lowercase($s), /\b(bank|credit cards?|debit cards?|cards?)\b/, ''), /\s+/, ' ')) };
        $want := $bank_words ? $norm($bank_words);
        $banks := function($o) { [($o.offerType = "CAMPAIGN" ? $o.paymentTypeGroups.paymentType : $o.paymentType)[$type($) = "string"]] };
        $isWanted := function($b) { ($n := $norm($b); $n != "" and ($contains($n, $want) or $contains($want, $n))) };
        $products := function($o) { $o.offerType = "CAMPAIGN" ? [$o.groupedProducts] : [$o.product] };
        $fits := function($o) {
          ($product_code ? $product_code in $products($o) : true)
          and ($journey_type ? ($o.journeyType = $journey_type or $o.journeyType = "BOTH" or $not($exists($o.journeyType))) : true)
          and ($want ? $count($banks($o)[$isWanted($)]) > 0 : true)
        };
        $kept := [$all[$fits($)]];
        $asked := $product_code or $journey_type or $want;
        [
          $merge([
            { "offers_on_ixigo": $d.count, "by_journey": $d.journeyGroups ? [$d.journeyGroups.($lowercase(journeyType) & ": " & $string(count))] },
            $asked ? { "asked_for": $join([$product_code ? $lowercase($product_code), $journey_type ? $lowercase($journey_type), $bank_words], ", "), "fit": $count($kept) }
          ]),
          { "banks_with_offers": [$d.paymentTypesOfferGroup.(paymentType & ": " & $string(associatedOffers))] },
          $kept.(
            offerType = "CAMPAIGN" ? {
              "sale": campaignName,
              "for": [groupedProducts.$lowercase($)],
              "banks": [paymentTypeGroups.paymentType],
              "journey": $lowercase(journeyType),
              "until": $until(endDate),
              "campaign": campaignSlug
            } : {
              "offer": offerTitle,
              "code": offerCode,
              "for": product ? $lowercase(product),
              "bank": paymentType ? $trim(paymentType),
              "journey": $lowercase(journeyType),
              "valid_on": $validOn(recurringDay),
              "until": $until(endDate),
              "details": slug
            }
          )
        ]
      )
  also:
    more: { from: /upahaar-inventory/api/offers/v2/list, format: json, value: $ }
# The fast speed: every offer at once, as the page asks for them (with no journey when none is given), read by the
# same list.
fast:
  url: "/upahaar-inventory/api/offers/v2/list?{$journey_param|raw}page=1&limit=50"
  headers: { ixisrc: ixiweb, clientid: ixiweb }
  list: *offers
answer:
  as: facts
  title: Offers on ixigo now
  max: 30
  each: $
ttl_minutes: 60
samples: { page: offers.list.html, fast: offers.list.fast.json }
measured: { fast_ms: 63, page_ms: 2630, flow_ms: null }
notes: >-
  "details" is an offer's name for offers.details, "campaign" a sale's for offers.campaign. "fit" is how many offers the
  page has for what was asked; none for a bank says so, and banks_with_offers says which banks do. Every offer needs the
  person's ixigo login and the named card at payment: Go only says which code fits.
