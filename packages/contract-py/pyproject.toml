[project]
name = "go-contract"
version = "1.1.0"
description = "The Go contract for Python: models for every body, request signing and spend approvals."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "datamodel-code-generator==0.83.0", "black==26.10.0", "isort==8.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go_contract"]
